# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/meta.schema.json
#
# Catalogue dev-pour-ops-dsoxlab-training, décrit par le contrat v1 de dsoxlab.
#
# Les labs de la formation « Développer pour les Ops » du blog : une
# initiation au développement pour un Ops qui ne connaît pas Python. Un FIL
# ROUGE : certcheck, un contrôle d'expiration de certificats que l'apprenant
# lit et modifie (petit script, puis projet Python), dont il installe les
# dépendances, lance et corrige les tests, et qu'il fait relire. L'ordre
# ci-dessous est celui du jeu. La CI de certcheck se joue sur la forge du
# catalogue cicd-dsoxlab-training (lab ci-certcheck).
#
# Recentrage validé par Stéphane le 2026-10-13 : cœur de six labs courts,
# deux labs et un défi facultatifs, épreuve « intervenir » en shell.
#
# tests/test_meta_declare_les_labs.py refuse un lab sur disque absent d'ici,
# et un lab déclaré ici absent du disque.
schema_version: 1

repo:
  id: dev-pour-ops-dsoxlab-training
  # Les solutions de référence de ce catalogue sont EN CLAIR, et c'est
  # délibéré : les labs du fil rouge sont enchaînés, et le point de départ de
  # chacun est la solution du précédent, recopiée comme fixture. Un fichier
  # chiffré ne pourrait pas jouer ce rôle.
  #
  # Sans cette déclaration, `validate-structure` les signale, à juste titre :
  # son défaut était de ne regarder que `solution/` à la racine du dépôt, donc
  # de ne jamais voir `labs/<lab>/solution/`. Il regarde depuis dsoxlab 0.5.0.
  solutions: plaintext
  category: development
  title: "Development for Ops: verifiable labs"
  blog_url: "https://blog.stephane-robert.info/docs/developper/"
  issues_url: "https://github.com/stephrobert/dev-pour-ops-dsoxlab-training/issues"
  description: |
    A first step into development for Ops, in Python. One common thread,
    certcheck: you read and modify a small inherited script, find your way
    around the Python project it became, install its dependencies, run and
    fix its tests, debug it and get it reviewed. Each lab is graded on what a
    caller observes: outputs, exit codes, files in the repository.

# PAS de bloc `infra:` : tous les labs sont de type `shell`. L'outil se joue
# sur le poste de l'apprenant. Prérequis : les outils de mise.toml
# (`mise install`), plus Bash, openssl et Git du système.

sections:
  - id: fil-rouge
    title: "The common thread: read, modify, test and review a small tool"
    description: "Read and modify a small inherited Python script, find your way around the Python project it became, install its dependencies, use its tests, debug it and review a change."
    labs:
      - lire-du-code
      - script-en-outil
      - dependances-reproductibles
      - tester-une-automatisation
      - deboguer
      - relire-une-automatisation

  # Facultatifs : hors du cœur de l'initiation, pour aller plus loin.
  - id: approfondir
    title: "Going further"
    description: "Optional: call an API, ship an installable versioned release, and the challenge of taking over a whole tool."
    labs:
      - appeler-une-api
      - livrer-un-outil
      - level-exams/outil

  # Épreuve de fin du niveau o1 : une MESURE, pas un cours. Une intervention
  # limitée sur un petit projet Python, notée en boîte noire, sans indice.
  - id: level-exams
    title: "Level exam"
    description: "Step in on a small operations tool: read it, read its CI log and history, make a limited fix, and get tests, quality checks and CI steps back to green. Graded as a black box, without hints."
    labs:
      - level-exams/intervenir
