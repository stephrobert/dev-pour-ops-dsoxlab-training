repo:
  title: "Développer pour les Ops : les labs vérifiables"
  description: |
    Une initiation au développement pour les Ops, en Python. Un seul fil
    rouge, certcheck : vous lisez et modifiez un petit script hérité, vous
    repérez dans le projet Python qu'il est devenu, installez ses
    dépendances, lancez et corrigez ses tests, le déboguez et le faites
    relire. Chaque lab est noté sur ce qu'un appelant observe : sorties,
    codes de sortie, fichiers du dépôt.

sections:
  - id: fil-rouge
    title: "Le fil rouge : lire, modifier, tester et faire relire un petit outil"
    description: "Lire et modifier un petit script Python hérité, se repérer dans le projet Python qu'il est devenu, installer ses dépendances, se servir de ses tests, le déboguer et relire un changement."
  - id: approfondir
    title: "Aller plus loin"
    description: "Facultatif : transformer et valider des données de services, construire une CLI Go, appeler une API, livrer une version et reprendre un outil entier."
  - id: level-exams
    title: "Épreuve de niveau"
    description: "Intervenir sur un petit outil d'exploitation : le lire, lire son journal de CI et son historique, faire une correction limitée, et rendre verts tests, contrôles de qualité et étapes de CI. Noté en boîte noire, sans indice."
