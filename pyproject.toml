[project]
name = "dev-pour-ops-dsoxlab-training"
version = "0.3.0"
description = "Labs vérifiables de la formation Développer pour les Ops du blog, joués avec dsoxlab"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.uv]
# Ce dépôt n'est pas un package Python : c'est un catalogue de labs. Les
# projets de l'apprenant (labs/*/fixtures/pyproject.toml) ont chacun le leur.
package = false

[tool.ruff]
# Jeu de règles repris des catalogues frères.
target-version = "py312"
# `labs/*/fixtures/` est le point de départ que l'apprenant reçoit, et
# `challenge/work` ce qu'il écrit : le lint du catalogue n'y touche pas.
exclude = [
    "labs/*/fixtures",
    "labs/*/challenge/work",
    # Les mutants sont du code DÉLIBÉRÉMENT faux : ils servent à vérifier que
    # les tests de l'apprenant attrapent une régression. Les linter revient à
    # linter une fixture, pour la même raison.
    "labs/*/challenge/tests/mutants",
    # Une `solution/` n'est PAS un projet complet : elle se pose par-dessus les
    # fixtures, et c'est le répertoire de travail ainsi formé qui se lint. Vue
    # depuis la racine, il lui manque les modules que les fixtures apportent —
    # `certcheck.erreurs` par exemple — et ruff range alors les imports
    # autrement que dans le workdir. Mesuré sur `relire-une-automatisation`,
    # dont un test exige précisément que `ruff check` passe sur le code de
    # base : appliquer le tri de la racine faisait échouer le test du lab.
    #
    # Les solutions restent lintées, mais là où elles ont un sens : par le test
    # du lab, dans le workdir, avec la configuration du lab.
    #
    # ATTENTION : cette ligne ne vaut que pour la DÉCOUVERTE (`ruff check .`).
    # Un fichier passé en ARGUMENT — ce que fait pre-commit — fait résoudre à
    # ruff la configuration la plus proche, et six solutions portent leur
    # propre `pyproject.toml`. L'exclusion qui tient dans ce cas est celle du
    # hook `ruff` dans `.pre-commit-config.yaml` ; les deux sont nécessaires.
    "labs/*/solution",
    "labs/*/*/solution",
]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",
    "I", "UP", "B", "BLE", "SIM", "RUF", "EXE", "DTZ", "PLE", "PLW", "S",
]
ignore = [
    # Les messages d'assertion enseignent ; les couper les rendrait moins lisibles.
    "E501",
    # `assert` est le verbe de pytest.
    "S101",
    # Lancer uv par son nom depuis le PATH est le métier des tests de ce dépôt.
    "S603", "S607",
]

[tool.pytest.ini_options]
# Chaque lab nomme son test challenge/tests/test_functional.py : importlib
# isole ces fichiers de même nom par leur chemin.
addopts = "--import-mode=importlib -p no:cacheprovider"
# Ne collecter QUE les tests des challenges. Le dernier lab livre des tests
# dans son point de départ : ce sont ceux de l'apprenant, jamais lancés ici.
testpaths = ["labs"]
norecursedirs = [
    "fixtures", "work", "solution", "mutants", ".git", ".venv", "__pycache__",
]
