[project]
name = "dev-pour-ops-dsoxlab-training"
version = "0.1.0"
description = "Labs vérifiables de la formation Développer pour les Ops du blog, joués avec dsoxlab"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.uv]
# Ce dépôt n'est pas un package Python : c'est un catalogue de labs. Les
# projets de l'apprenant (labs/*/fixtures/pyproject.toml) ont chacun le leur.
package = false

[tool.ruff]
# Jeu de règles repris des catalogues frères.
target-version = "py312"
# `labs/*/fixtures/` est le point de départ que l'apprenant reçoit, et
# `challenge/work` ce qu'il écrit : le lint du catalogue n'y touche pas.
exclude = [
    "labs/*/fixtures",
    "labs/*/challenge/work",
]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",
    "I", "UP", "B", "BLE", "SIM", "RUF", "EXE", "DTZ", "PLE", "PLW", "S",
]
ignore = [
    # Les messages d'assertion enseignent ; les couper les rendrait moins lisibles.
    "E501",
    # `assert` est le verbe de pytest.
    "S101",
    # Lancer uv par son nom depuis le PATH est le métier des tests de ce dépôt.
    "S603", "S607",
]

[tool.pytest.ini_options]
# Chaque lab nomme son test challenge/tests/test_functional.py : importlib
# isole ces fichiers de même nom par leur chemin.
addopts = "--import-mode=importlib -p no:cacheprovider"
# Ne collecter QUE les tests des challenges. Le dernier lab livre des tests
# dans son point de départ : ce sont ceux de l'apprenant, jamais lancés ici.
testpaths = ["labs"]
norecursedirs = [
    "fixtures", "work", "solution", "mutants", ".git", ".venv", "__pycache__",
]
