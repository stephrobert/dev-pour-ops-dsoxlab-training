[project]
name = "certcheck"
version = "0.4.0"
description = "Signale les certificats TLS d'un parc qui arrivent à expiration."
requires-python = ">=3.12"
# Bibliothèque standard seule, plus le programme openssl du système.
dependencies = []

[project.scripts]
certcheck = "certcheck.cli:main"

[dependency-groups]
# Les outils du développeur, pas ceux de l'outil : `uv run pytest` les installe
# dans .venv, la production n'en a pas besoin. Version exacte, verrouillée dans
# uv.lock.
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"
