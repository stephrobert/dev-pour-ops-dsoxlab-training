id: tester-une-automatisation
title: "Se servir des tests : un test rouge, lu, corrigé, et un test de plus"
description: |
  certcheck a quatre tests, et l'un d'eux est rouge. Lancez la suite, lisez
  quel test échoue et ce que son assertion compare, corrigez le code (pas le
  test), relancez jusqu'au vert, puis ajoutez un test en copiant un modèle :
  il doit attraper un nouveau défaut que les quatre tests laissent passer.
