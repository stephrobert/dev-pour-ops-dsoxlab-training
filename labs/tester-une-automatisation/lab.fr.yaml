id: tester-une-automatisation
title: "Premiers tests : pytest attrape deux vrais bogues"
description: |
  certcheck décide si le contrôle de la nuit passe au rouge : il ne doit pas
  changer de comportement sans qu'on le voie. Écrivez vos premiers tests
  pytest, pas à pas : une date fixée, la frontière du seuil, le code de
  sortie, un fichier temporaire. La suite est notée sur ce qu'elle attrape :
  verte sur l'outil juste, rouge sur deux versions qui portent chacune un
  bogue réaliste.
