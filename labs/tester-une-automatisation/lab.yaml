# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: tester-une-automatisation
title: "Use the tests: a red test, read, fixed, and one more test"
description: |
  certcheck has four tests, and one of them is red. Run the suite, read which
  test fails and what its assertion compares, fix the code (not the test),
  run it again until green, then add one test by copying a model: it must
  catch a new bug that the four tests let through.
section: fil-rouge
level: o1
difficulty: beginner
lab_type: lab
estimated_time: 20m
skills:
  - python
  - pytest
  - testing
distros:
  - any
doc_url: https://www.stephane-robert.info/docs/developper/pratiques/tester-une-automatisation/
runtime:
  type: shell
  workdir: challenge/work
  # Le point de départ est le paquet de certcheck avec un défaut dans la
  # décision (seuil exclusif), et quatre tests dont un est rouge.
  fixtures:
    - .gitignore
    - pyproject.toml
    - uv.lock
    - src/certcheck/__init__.py
    - src/certcheck/erreurs.py
    - src/certcheck/certificats.py
    - src/certcheck/inventaire.py
    - src/certcheck/forge.py
    - src/certcheck/cli.py
    - bin/certcheck
    - CONTRAT.md
    - inventaire.txt
    - certs/web-01.pem
    - certs/web-02.pem
    - certs/vpn-01.pem
    - certs/mail-01.pem
    - tests/test_certcheck.py
    - reponses.yaml
validation:
  functional: true
  security: false
  persistence_after_reboot: false
