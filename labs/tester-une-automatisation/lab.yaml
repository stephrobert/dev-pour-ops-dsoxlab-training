# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: tester-une-automatisation
title: "Test an automation: a suite that catches four real bugs"
description: |
  certcheck decides whether a nightly check turns red and opens a ticket on
  the forge: it must not change behaviour unnoticed. Write its pytest suite,
  with an injected clock and a fake forge. It is graded on what it catches:
  it must pass on the correct tool and fail on four mutants, each carrying
  one realistic bug.
section: fil-rouge
level: o1
difficulty: intermediate
lab_type: lab
estimated_time: 45m
skills:
  - python
  - pytest
  - testing
  - test-doubles
  - mutation-testing
distros:
  - any
doc_url: https://blog.stephane-robert.info/docs/developper/pratiques/tester-une-automatisation/
runtime:
  type: shell
  workdir: challenge/work
  # Le point de départ est la référence de certcheck dans un petit projet uv,
  # plus un fichier de tests qui ne contient qu'un exemple.
  fixtures:
    - .gitignore
    - pyproject.toml
    - uv.lock
    - certcheck.py
    - bin/certcheck
    - CONTRAT.md
    - inventaire.txt
    - certs/web-01.pem
    - certs/web-02.pem
    - certs/vpn-01.pem
    - certs/mail-01.pem
    - tests/test_certcheck.py
validation:
  functional: true
  security: false
  persistence_after_reboot: false
