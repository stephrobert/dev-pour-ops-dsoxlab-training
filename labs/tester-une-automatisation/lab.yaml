# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: tester-une-automatisation
title: "Your first tests: pytest catches two real bugs"
description: |
  certcheck decides whether the nightly check turns red: it must not change
  behaviour unnoticed. Write your first pytest tests, step by step: a
  fixed date, the threshold boundary, the exit code, a temporary file. The
  suite is graded on what it catches: green on the correct tool, red on two
  versions that each carry one realistic bug.
section: fil-rouge
level: o1
difficulty: beginner
lab_type: lab
estimated_time: 25m
skills:
  - python
  - pytest
  - testing
distros:
  - any
doc_url: https://blog.stephane-robert.info/docs/developper/pratiques/tester-une-automatisation/
runtime:
  type: shell
  workdir: challenge/work
  # Le point de départ est le paquet de référence de certcheck, plus un
  # fichier de tests qui ne contient encore aucun test.
  fixtures:
    - .gitignore
    - pyproject.toml
    - uv.lock
    - src/certcheck/__init__.py
    - src/certcheck/erreurs.py
    - src/certcheck/certificats.py
    - src/certcheck/inventaire.py
    - src/certcheck/forge.py
    - src/certcheck/cli.py
    - bin/certcheck
    - CONTRAT.md
    - inventaire.txt
    - certs/web-01.pem
    - certs/web-02.pem
    - certs/vpn-01.pem
    - certs/mail-01.pem
    - tests/test_certcheck.py
validation:
  functional: true
  security: false
  persistence_after_reboot: false
