# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: deboguer
title: "Debug step by step: the certificate certcheck cannot read"
description: |
  A ticket says certcheck reports vpn-01 as unreadable while openssl reads
  its certificate fine. Guided step by step: reproduce the bug with a test
  that fails, look at the faulty value with print or pdb, fix it without
  breaking the rest of the contract, keep the test, and write down what you
  saw, the cause and the fix.
section: fil-rouge
level: o1
difficulty: beginner
lab_type: lab
estimated_time: 25m
skills:
  - debugging
  - python
  - pdb
  - pytest
distros:
  - any
doc_url: https://blog.stephane-robert.info/docs/developper/pratiques/deboguer/
runtime:
  type: shell
  workdir: challenge/work
  # Le même paquet que tester-une-automatisation, mais certificats.py porte un
  # bogue (généré par scripts/generer_mutants.py) et un ticket le signale.
  fixtures:
    - .gitignore
    - pyproject.toml
    - uv.lock
    - src/certcheck/__init__.py
    - src/certcheck/erreurs.py
    - src/certcheck/certificats.py
    - src/certcheck/inventaire.py
    - src/certcheck/forge.py
    - src/certcheck/cli.py
    - bin/certcheck
    - CONTRAT.md
    - TICKET.md
    - inventaire.txt
    - certs/web-01.pem
    - certs/web-02.pem
    - certs/vpn-01.pem
    - certs/mail-01.pem
    - tests/test_certcheck.py
validation:
  functional: true
  security: false
  persistence_after_reboot: false
