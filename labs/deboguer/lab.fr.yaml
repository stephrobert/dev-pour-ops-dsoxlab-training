id: deboguer
title: "Déboguer pas à pas : le certificat que certcheck ne sait pas lire"
description: |
  Un ticket signale que certcheck déclare vpn-01 illisible alors qu'openssl
  lit très bien son certificat. Guidé pas à pas : reproduisez le bogue par
  un test qui échoue, regardez la valeur fautive avec print ou pdb,
  corrigez sans casser le reste du contrat, gardez le test, et notez ce que
  vous avez vu, la cause et la correction.
