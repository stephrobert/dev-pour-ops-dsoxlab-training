id: livrer-un-outil
title: "Livrer un outil interne : certcheck 1.0.0, étiqueté et installable"
description: |
  certcheck a des dépendances reproductibles ; il reste à le livrer.
  Passez-le en version 1.0.0 avec une seule source pour la version, datez
  le journal des changements, mettez le projet sous Git avec une étiquette
  annotée v1.0.0, construisez la roue et le sdist, et prouvez qu'un
  environnement vierge installe et lance l'outil à partir de l'étiquette
  seule. Demande un accès réseau à PyPI.
