id: livrer-un-outil
title: "Livrer un outil : certcheck 1.0.0, versionné et installable"
description: |
  certcheck déclare ses dépendances ; il reste à le livrer, sans rien
  publier. Pas à pas : la version 1.0.0 écrite une seule fois dans
  pyproject.toml et affichée par --version, une section 1.0.0 dans le
  CHANGELOG, une étiquette Git v1.0.0, puis la preuve qu'un environnement
  neuf installe l'outil, depuis le répertoire de travail et depuis un clone
  de l'étiquette. Demande un accès réseau à PyPI.
