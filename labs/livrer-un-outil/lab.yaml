# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: livrer-un-outil
title: "Shipping an internal tool: certcheck 1.0.0, tagged and installable"
description: |
  certcheck has reproducible dependencies; it now has to be shipped. Bring
  it to version 1.0.0 with a single source for the version, date the
  changelog, put the project under Git with an annotated v1.0.0 tag, build
  the wheel and the sdist, and prove that a clean environment installs and
  runs the tool from the tag alone. Needs network access to PyPI.
section: fil-rouge
level: o1
difficulty: intermediate
lab_type: lab
estimated_time: 40m
skills:
  - versioning
  - changelog
  - git-tags
  - packaging
  - uv
  - python
distros:
  - any
doc_url: https://blog.stephane-robert.info/docs/developper/pratiques/livrer-un-outil/
runtime:
  type: shell
  workdir: challenge/work
  fixtures:
    - CONTRAT.md
    - README.md
    - CHANGELOG.md
    - .gitignore
    - .python-version
    - pyproject.toml
    - uv.lock
    - src/certcheck/__init__.py
    - src/certcheck/cli.py
    - bin/certcheck
    - inventaire.txt
    - certs/web-01.pem
    - certs/web-02.pem
    - certs/vpn-01.pem
    - certs/mail-01.pem
validation:
  functional: true
  security: false
  persistence_after_reboot: false
