# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: livrer-un-outil
title: "Ship a tool: certcheck 1.0.0, versioned and installable"
description: |
  certcheck declares its dependencies; it now has to be shipped, without
  publishing anything. Step by step: version 1.0.0 written once in
  pyproject.toml and shown by --version, a CHANGELOG section for 1.0.0, a
  Git tag v1.0.0, then proof that a fresh environment installs the tool,
  from the working directory and from a clone of the tag. Needs network
  access to PyPI.
section: approfondir
level: o1
difficulty: beginner
lab_type: lab
estimated_time: 25m
skills:
  - versioning
  - changelog
  - git-tags
  - packaging
  - python
distros:
  - any
doc_url: https://dev.stephane-robert.info/docs/developper/pratiques/livrer-un-outil/
runtime:
  type: shell
  workdir: challenge/work
  fixtures:
    - CONTRAT.md
    - README.md
    - CHANGELOG.md
    - .gitignore
    - .python-version
    - pyproject.toml
    - uv.lock
    - src/certcheck/__init__.py
    - src/certcheck/cli.py
    - bin/certcheck
    - inventaire.txt
    - certs/web-01.pem
    - certs/web-02.pem
    - certs/vpn-01.pem
    - certs/mail-01.pem
validation:
  functional: true
  security: false
  persistence_after_reboot: false
