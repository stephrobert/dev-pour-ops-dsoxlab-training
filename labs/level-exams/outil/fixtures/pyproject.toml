[project]
name = "certcheck"
version = "0.4.0"
description = "Signale les certificats TLS d'un parc qui arrivent à expiration."
requires-python = ">=3.12"
# Bibliothèque standard seule, plus le programme openssl du système.
dependencies = []

# La commande `certcheck` que uv installe dans l'environnement du projet :
# elle appelle la fonction main du module certcheck.cli.
[project.scripts]
certcheck = "certcheck.cli:main"

[dependency-groups]
# Les outils du développeur, épinglés à une version exacte et verrouillés
# dans uv.lock : `uv run pytest` installe pytest 9.1.1, et lui seul.
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
