# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: level-exams-outil
title: "Exam: take over an operations tool"
description: |
  You inherit certcheck.sh, a Bash script that counts a missing certificate
  as "0 days" and always exits 0, its written contract, and a colleague's
  pull request to review. In Bash, Python or Go, deliver a tool that honours
  the contract, its own black-box test suite, a tagged and installable
  version, and the review. Graded on the contract with hidden tests, without
  hints.
section: level-exams
level: o1
difficulty: intermediate
lab_type: capstone
exam_passing_score: 70
estimated_time: 120m
skills:
  - cli-design
  - exit-codes
  - http-api
  - testing
  - release
  - dependency-pinning
  - code-review
  - python
  - go
  - bash
distros:
  - any
doc_url: https://blog.stephane-robert.info/docs/developper/parcours/
runtime:
  type: shell
  workdir: challenge/work
  # Le point de départ : le script hérité et son lanceur, le contrat, un
  # inventaire, la pull request n°57 à relire (le projet pr/main et son diff),
  # et les deux fichiers à remplir, revue.yaml et CHOIX.md.
  fixtures:
    - .gitignore
    - CONTRAT.md
    - CHOIX.md
    - certcheck.sh
    - bin/certcheck
    - inventaire.txt
    - certs/web-01.pem
    - certs/web-02.pem
    - certs/vpn-01.pem
    - certs/mail-01.pem
    - pr/DESCRIPTION.md
    - pr/0057.diff
    - pr/main/certcheck.py
    - pr/main/pyproject.toml
    - pr/main/tests/test_certcheck.py
    - revue.yaml
validation:
  functional: true
  security: false
  persistence_after_reboot: false
