# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: level-exams-outil
title: "Challenge: take over an operations tool"
description: |
  You inherit certcheck.sh, a Bash script that counts a missing certificate
  as "0 days" and always exits 0, its written contract, and a colleague's
  pull request to review. Replace it with the Python project whose skeleton
  is provided (pyproject.toml, uv.lock, a package under src/ with functions
  to write): an implementation that honours the contract, its own pytest
  suite that catches the inherited bug, an installable package, a version
  recorded in the CHANGELOG and tagged in Git, and the review. Graded on the
  contract with hidden tests, without hints.
section: approfondir
level: o1
difficulty: intermediate
lab_type: capstone
exam_passing_score: 70
estimated_time: 60m
skills:
  - python
  - packaging
  - cli-design
  - exit-codes
  - testing
  - release
  - code-review
distros:
  - any
doc_url: https://dev.stephane-robert.info/docs/developper/pratiques/livrer-un-outil/
runtime:
  type: shell
  workdir: challenge/work
  # Le point de départ : le script hérité, le squelette du projet Python
  # (pyproject.toml, uv.lock, le paquet sous src/ et son lanceur), le contrat, un
  # inventaire, la pull request n°57 à relire (le projet pr/main et son diff),
  # et le fichier de la revue, revue.yaml.
  fixtures:
    - .gitignore
    - CONTRAT.md
    - certcheck.sh
    - pyproject.toml
    - uv.lock
    - src/certcheck/__init__.py
    - src/certcheck/certificats.py
    - src/certcheck/cli.py
    - bin/certcheck
    - inventaire.txt
    - certs/web-01.pem
    - certs/web-02.pem
    - certs/vpn-01.pem
    - certs/mail-01.pem
    - pr/DESCRIPTION.md
    - pr/0057.diff
    - pr/main/certcheck.py
    - pr/main/pyproject.toml
    - pr/main/tests/test_certcheck.py
    - revue.yaml
validation:
  functional: true
  security: false
  persistence_after_reboot: false
