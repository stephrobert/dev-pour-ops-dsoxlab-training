# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: dependances-reproductibles
title: "Dependencies: certcheck installs elsewhere too"
description: |
  A colleague moved certcheck to the cryptography and requests libraries,
  installed them by hand in his virtual environment, and declared nothing:
  "works on my machine". Step by step: declare both dependencies, pin their
  versions, note the Python version, and prove that a fresh environment
  installs the tool from the project files alone. Needs network access to
  PyPI.
section: fil-rouge
level: o1
difficulty: beginner
lab_type: lab
estimated_time: 25m
skills:
  - dependencies
  - virtualenv
  - pip
  - uv
  - python
distros:
  - any
doc_url: https://blog.stephane-robert.info/docs/developper/pratiques/dependances-reproductibles/
runtime:
  type: shell
  workdir: challenge/work
  fixtures:
    - CONTRAT.md
    - README.md
    - pyproject.toml
    - src/certcheck/__init__.py
    - src/certcheck/cli.py
    - bin/certcheck
    - inventaire.txt
    - certs/web-01.pem
    - certs/web-02.pem
    - certs/vpn-01.pem
    - certs/mail-01.pem
validation:
  functional: true
  security: false
  persistence_after_reboot: false
