id: dependances-reproductibles
title: "Dépendances : certcheck s'installe aussi ailleurs"
description: |
  Un collègue a fait passer certcheck aux bibliothèques cryptography et
  requests, les a installées à la main dans son environnement virtuel, et
  n'a rien déclaré : « ça marche sur mon poste ». Pas à pas : déclarez les
  deux dépendances, épinglez leurs versions, notez la version de Python, et
  prouvez qu'un environnement neuf installe l'outil à partir des seuls
  fichiers du projet. Demande un accès réseau à PyPI.
