# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: appeler-une-api
title: "Call an API with requests: certcheck opens its ticket"
description: |
  certcheck must open a ticket on the forge when certificates are due. Step
  by step, with the requests library declared and pinned in the project:
  the token in the Authorization header and never in the URL, a timeout on
  each request, an HTTP error turned into exit code 3 with a clear message,
  the ticket created with the right title, and no duplicate when it is
  already open. Graded on the requests received by a fake forge.
section: approfondir
level: o1
difficulty: beginner
lab_type: lab
estimated_time: 30m
skills:
  - rest-api
  - requests
  - authentication
  - timeouts
  - python
distros:
  - any
doc_url: https://dev.stephane-robert.info/docs/developper/api-rest/
runtime:
  type: shell
  workdir: challenge/work
  fixtures:
    - .gitignore
    - pyproject.toml
    - uv.lock
    - CONTRAT.md
    - src/certcheck/__init__.py
    - src/certcheck/erreurs.py
    - src/certcheck/certificats.py
    - src/certcheck/inventaire.py
    - src/certcheck/forge.py
    - src/certcheck/cli.py
    - bin/certcheck
    - forge_factice.py
    - inventaire.txt
    - certs/web-01.pem
    - certs/web-02.pem
    - certs/api-01.pem
    - certs/db-01.pem
    - certs/mail-01.pem
validation:
  functional: true
  security: false
  persistence_after_reboot: false
