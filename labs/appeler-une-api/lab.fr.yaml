id: appeler-une-api
title: "Appeler une API avec requests : certcheck ouvre son ticket"
description: |
  certcheck doit ouvrir un ticket sur la forge quand des certificats sont à
  renouveler. Pas à pas, avec la bibliothèque requests déclarée et épinglée
  dans le projet : le jeton dans l'en-tête Authorization et jamais dans
  l'URL, un délai maximal sur chaque requête, une erreur HTTP traduite en
  code 3 avec un message clair, le ticket créé avec le bon titre, et pas de
  doublon s'il est déjà ouvert. Noté sur les requêtes reçues par une forge
  factice.
