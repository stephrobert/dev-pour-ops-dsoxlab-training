id: relire-une-automatisation
title: "Relire une pull request : quatre défauts dans la n°42 de certcheck"
description: |
  Un collègue propose la pull request n°42 sur certcheck : purge des anciens
  rapports et notification du chat. Ses tests sont verts. Lisez le diff tel
  qu'il serait fusionné, trouvez au moins trois de ses quatre défauts
  (erreur avalée, secret affiché, chemin dangereux, test absent),
  commentez-les avec une correction concrète, tranchez, puis versionnez une
  configuration ruff et faites passer ruff check.
