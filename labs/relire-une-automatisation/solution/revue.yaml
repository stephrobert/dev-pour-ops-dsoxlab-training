commentaires:
  - fichier: src/certcheck/cli.py
    ligne: 98
    categorie: secret-affiche
    commentaire: "L'URL du webhook contient le jeton (?token=...), et cette ligne l'écrit sur la sortie d'erreur : chaque nuit, le jeton finit dans le courriel de cron et dans les journaux."
    proposition: "Ne jamais afficher l'URL : écrire « notification envoyée » seul, ou seulement le nom d'hôte du chat, sans chemin ni paramètres."
  - fichier: src/certcheck/maintenance.py
    ligne: 16
    categorie: chemin-dangereux
    commentaire: "Si CERTCHECK_REPORT_DIR n'est pas défini, le dossier vaut « / » : la boucle passe sur /etc, /home et /var, et shutil.rmtree supprime tout ce qui est plus vieux que le seuil."
    proposition: "Exiger CERTCHECK_REPORT_DIR (code 2 s'il manque), refuser « / » et un chemin relatif, et ne supprimer que les sous-dossiers dont le nom est une date AAAA-MM-JJ."
  - fichier: src/certcheck/maintenance.py
    ligne: 36
    categorie: erreur-avalee
    commentaire: "except Exception: pass avale tout, y compris un jeton révoqué (401) ou une URL fausse : la notification peut ne jamais partir sans que personne le sache."
    proposition: "Attraper urllib.error.URLError seulement et journaliser l'échec en avertissement, sans l'URL : le contrôle continue, mais l'échec se voit."
  - fichier: src/certcheck/maintenance.py
    ligne: 27
    categorie: test-absent
    commentaire: "notifier() n'est appelée par aucun test : ni l'envoi, ni le cas sans alerte, ni l'échec du chat. Le test ajouté ne couvre que la purge."
    proposition: "Ajouter un test contre un petit serveur HTTP local (http.server sur 127.0.0.1) : un envoi réussi, et aucune requête quand il n'y a pas d'alerte."
verdict: demander-des-changements
