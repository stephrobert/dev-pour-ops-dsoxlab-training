# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: relire-une-automatisation
title: "Review a pull request: four defects in certcheck #42"
description: |
  A colleague proposes pull request #42 on certcheck: purging old reports
  and notifying the chat. Its tests are green. Read the diff as it would be
  merged, find at least three of its four defects (swallowed error, printed
  secret, dangerous path, missing test), comment each with a concrete fix,
  decide, then version a ruff configuration and make ruff check pass.
section: fil-rouge
level: o1
difficulty: beginner
lab_type: lab
estimated_time: 25m
skills:
  - code-review
  - python
  - secrets
  - ruff
distros:
  - any
doc_url: https://www.stephane-robert.info/docs/developper/pratiques/relire-une-automatisation/
runtime:
  type: shell
  workdir: challenge/work
  fixtures:
    - pyproject.toml
    - uv.lock
    - src/certcheck/__init__.py
    - src/certcheck/erreurs.py
    - src/certcheck/certificats.py
    - src/certcheck/inventaire.py
    - src/certcheck/forge.py
    - src/certcheck/cli.py
    - tests/test_certcheck.py
    - pr/DESCRIPTION.md
    - pr/0042.diff
    - revue.yaml
validation:
  functional: true
  security: false
  persistence_after_reboot: false
