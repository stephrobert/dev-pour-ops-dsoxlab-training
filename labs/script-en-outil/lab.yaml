# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: script-en-outil
title: "From script to tool: certcheck honours its contract"
description: |
  The inherited script always exits 0, hides errors and has no help. Rewrite
  it as a tool, in Python, Go or Bash, that honours a written contract:
  help and arguments, actionable exit codes, a JSON output, configuration
  through the environment, errors on stderr and a dry-run mode. Graded as a
  black box, through bin/certcheck.
section: fil-rouge
level: o1
difficulty: intermediate
lab_type: lab
estimated_time: 60m
skills:
  - cli-design
  - exit-codes
  - configuration
  - dry-run
  - python
  - go
  - bash
distros:
  - any
doc_url: https://blog.stephane-robert.info/docs/developper/pratiques/script-en-outil/
runtime:
  type: shell
  workdir: challenge/work
  fixtures:
    - CONTRAT.md
    - certcheck.sh
    - bin/certcheck
    - inventaire.txt
    - certs/web-01.pem
    - certs/web-02.pem
    - certs/vpn-01.pem
    - certs/mail-01.pem
validation:
  functional: true
  security: false
  persistence_after_reboot: false
