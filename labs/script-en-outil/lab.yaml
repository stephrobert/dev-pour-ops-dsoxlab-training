# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: script-en-outil
title: "Understand a Python tool, then modify it: certcheck and its contract"
description: |
  certcheck has become a Python project: a package in src layout, declared in
  pyproject.toml, run by bin/certcheck. Find where the command is declared,
  where the decision lives, which file cron runs and which exit codes it
  returns, then close two gaps with its contract: read the threshold from
  CERTCHECK_DAYS, and write errors on stderr.
section: fil-rouge
level: o1
difficulty: beginner
lab_type: lab
estimated_time: 20m
skills:
  - python
  - packaging
  - cli-design
  - exit-codes
  - configuration
distros:
  - any
doc_url: https://www.stephane-robert.info/docs/developper/pratiques/script-en-outil/
runtime:
  type: shell
  workdir: challenge/work
  fixtures:
    - CONTRAT.md
    - pyproject.toml
    - uv.lock
    - src/certcheck/__init__.py
    - src/certcheck/certificats.py
    - src/certcheck/cli.py
    - bin/certcheck
    - inventaire.txt
    - certs/web-01.pem
    - certs/web-02.pem
    - certs/vpn-01.pem
    - certs/mail-01.pem
    - reponses.yaml
validation:
  functional: true
  security: false
  persistence_after_reboot: false
