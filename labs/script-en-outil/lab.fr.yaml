id: script-en-outil
title: "Structurer un projet Python en outil : certcheck respecte son contrat"
description: |
  Le script Bash hérité sort toujours en 0, masque ses erreurs et n'a pas
  d'aide. Remplacez-le par un projet Python à compléter : un paquet en src
  layout, déclaré dans pyproject.toml et lancé par uv, qui respecte un
  contrat écrit et court : aide et version, codes de sortie exploitables,
  sortie JSON, seuil réglable par l'environnement et erreurs sur la sortie
  d'erreur. Noté en boîte noire, par bin/certcheck.
