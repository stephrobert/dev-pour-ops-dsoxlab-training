id: script-en-outil
title: "Comprendre un outil Python, puis le modifier : certcheck et son contrat"
description: |
  certcheck est devenu un projet Python : un paquet en src layout, déclaré
  dans pyproject.toml, lancé par bin/certcheck. Trouvez où la commande est
  déclarée, où vit la décision, quel fichier cron lance et quels codes de
  sortie il rend, puis comblez deux écarts au contrat : lire le seuil dans
  CERTCHECK_DAYS, et écrire les erreurs sur la sortie d'erreur.
