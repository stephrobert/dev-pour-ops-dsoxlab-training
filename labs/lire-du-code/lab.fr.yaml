id: lire-du-code
title: "Lire et modifier un petit script Python : le certcheck hérité"
description: |
  Un petit script Python hérité contrôle chaque nuit l'expiration des
  certificats, et personne dans l'équipe ne l'a écrit. Dites ce qu'il fait,
  trouvez ses entrées et la fonction qui décide, lisez ce qu'il affiche et son
  code de sortie, puis faites deux modifications simples : un seuil inclusif
  et un statut pour les certificats expirés.
