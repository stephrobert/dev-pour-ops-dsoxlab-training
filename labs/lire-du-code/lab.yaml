# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: lire-du-code
title: "Read and modify a small Python script: the inherited certcheck"
description: |
  A small inherited Python script checks certificate expiry every night, and
  nobody on the team wrote it. Say what it does, find its inputs and the
  function that decides, read what it prints and its exit code, then make two
  simple changes: an inclusive threshold, and an expired status.
section: fil-rouge
level: o1
difficulty: beginner
lab_type: lab
estimated_time: 25m
skills:
  - code-reading
  - python
  - exit-codes
  - first-change
distros:
  - any
doc_url: https://blog.stephane-robert.info/docs/developper/pratiques/lire-du-code/
runtime:
  type: shell
  workdir: challenge/work
  fixtures:
    - certcheck.py
    - inventaire.txt
    - certs/web-01.pem
    - certs/web-02.pem
    - certs/vpn-01.pem
    - certs/api-01.pem
    - certs/api-02.pem
    - reponses.yaml
validation:
  functional: true
  security: false
  persistence_after_reboot: false
