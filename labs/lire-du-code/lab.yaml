# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/lab.schema.json
id: lire-du-code
title: "Read the code of a Python application: the inherited certcheck package"
description: |
  An inherited Python package checks certificate expiry every night, and
  nobody on the team wrote it. Find its entry point and the modules it
  loads, its subprocess and its network call, run it without risk, name its
  real defects, and find in its Git history the commit that started
  swallowing errors.
section: fil-rouge
level: o1
difficulty: intermediate
lab_type: lab
estimated_time: 30m
skills:
  - code-reading
  - python
  - packaging
  - git-history
  - side-effects
distros:
  - any
doc_url: https://blog.stephane-robert.info/docs/developper/pratiques/lire-du-code/
runtime:
  type: shell
  workdir: challenge/work
  fixtures:
    - pyproject.toml
    - uv.lock
    - src/certcheck/__init__.py
    - src/certcheck/cli.py
    - src/certcheck/certificats.py
    - src/certcheck/forge.py
    - inventaire.txt
    - certs/web-01.pem
    - certs/web-02.pem
    - certs/vpn-01.pem
    - certs/mail-01.pem
    - historique.bundle
    - reponses.yaml
validation:
  functional: true
  security: false
  persistence_after_reboot: false
