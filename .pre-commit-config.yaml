# Hooks pre-commit d'un dépôt de CONTENU (catalogue de labs). Arrêt net sur les
# secrets et les clés privées, et sur les fichiers générés. Pas de mypy : il n'y
# a pas de source de paquet, et le contrat déclaratif est validé par
# `dsoxlab validate-structure`.
#
# Installation, une fois :   pre-commit install --install-hooks
# Sur tout le dépôt :        pre-commit run --all-files
#
# Repris de terraform-dsoxlab-training, le catalogue frère le plus proche
# (runtime `shell`, sans VM), avec deux différences que ce dépôt impose :
#
#   - les solutions de référence sont EN CLAIR dans `labs/<id>/solution/` :
#     la solution d'un lab est le point de départ du suivant (fil rouge,
#     voir CONTRIBUTING.md). Aucun hook de chiffrement n'a donc d'objet ici ;
#   - les tests propres au catalogue Terraform (Floci, jetons HCP, cursus)
#     sont remplacés par ceux de ce dépôt, sous `tests/`.

minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, pre-push]

# `labs/**/fixtures/` porte les DONNÉES d'entrée des labs, dont le contenu est
# significatif au caractère près, et les points de départ que l'apprenant
# reçoit : le rapport Trivy réel s'y livre tel que Trivy l'a écrit, et le code
# de départ tel que le lab précédent l'a laissé. Les mutants du dernier lab
# portent des défauts voulus : ruff n'a pas à les corriger.
exclude: '^labs/.*/(fixtures|challenge/tests/mutants)/'

repos:
  # Hygiène générale, et arrêt net sur les secrets et les clés privées.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '(^LICENSE$|\.md$)'
      - id: end-of-file-fixer
        exclude: '^LICENSE$'
      - id: check-yaml # valide chaque lab.yaml et meta.yml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: detect-private-key # bloque une clé SSH privée commitée
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint du python du catalogue)
        entry: uvx ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
        # Les solutions sont hors du lint du catalogue, et l'exclusion doit
        # être ICI et non dans `pyproject.toml` : `[tool.ruff] exclude` ne
        # vaut que pour la découverte, alors que pre-commit passe chaque
        # fichier en argument. Ruff résout alors la configuration la plus
        # PROCHE du fichier, et une solution porte son propre
        # `pyproject.toml` — elle est un projet Python livrable. Mesuré :
        # `--show-settings` sur un fichier de solution rend
        # `project_root = .../solution`. `--force-exclude` n'y change rien :
        # il force le respect d'`exclude`, pas le choix du fichier de config.
        #
        # Conséquence vécue : `--fix` a retrié les imports de
        # `relire-une-automatisation/solution/src/certcheck/cli.py`, dont un
        # test exige que `ruff check` passe sur le code de base. Le lab,
        # validé la veille, est devenu rouge.
        #
        # Une solution n'est pas un projet complet : `certcheck.erreurs` lui
        # vient des `fixtures/`, et c'est le répertoire de travail formé des
        # deux que le lab lint, avec la configuration du lab.
        #
        # L'exclusion reste sur ce seul hook : la mettre dans le `exclude:`
        # global soustrairait aussi ces vingt fichiers — ceux que le dépôt
        # publie EN CLAIR — à `detect-private-key` et `check-yaml`.
        exclude: '^labs/.*/solution/'

      # --no-update : ne jamais aller chercher un binaire neuf au moment du
      # hook, c'est un durcissement de la chaîne d'approvisionnement.
      - id: trufflehog
        name: trufflehog (scan de secrets)
        entry: trufflehog git file://. --since-commit HEAD --results=verified --fail --no-update
        language: system
        pass_filenames: false

      # Le catalogue des README doit lister TOUS les labs avec l'URL de leur
      # guide. Il est généré depuis les vrais lab.yaml : un catalogue périmé
      # bloque le push. `--no-project` : environnement éphémère avec juste
      # pyyaml, sans créer ni synchroniser le venv du dépôt.
      - id: catalogue-a-jour
        name: le catalogue des README est à jour (labs + URLs de guides)
        entry: uv run --no-project --with pyyaml python scripts/gen_catalog.py --check
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Les indices sont en base64 : un gabarit oublié passerait toute relecture.
      - id: indices-ecrits
        name: les indices de chaque lab ont été écrits
        entry: uv run --no-project --with pytest --with pyyaml pytest tests/test_hints_ecrits.py -q
        language: system
        pass_filenames: false
        always_run: true

      - id: meta-declare-les-labs
        name: meta.yml déclare chaque lab, et rien d'autre
        entry: uv run --no-project --with pytest --with pyyaml pytest tests/test_meta_declare_les_labs.py -q
        language: system
        pass_filenames: false
        always_run: true

      - id: style-apprenant
        name: ni emoji ni tiret cadratin dans ce que lit l'apprenant
        entry: uv run --no-project --with pytest --with pyyaml pytest tests/test_style_apprenant.py -q
        language: system
        pass_filenames: false
        always_run: true

      # Le verdict versionné couvre-t-il tous les labs, et est-il vert ? Une
      # milliseconde, sans rien rejouer : un lab ajouté sans campagne de
      # validation bloque le push.
      - id: labs-valides
        name: chaque lab a un verdict VALIDE dans validation-labs.json
        entry: uv run --no-project --with pyyaml python scripts/valider-labs.py --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Le contrat du catalogue, au push : `validate-structure` lit meta.yml,
      # chaque lab.yaml, chaque fixture déclarée et chaque lien relatif des
      # README. Il attrape ce qu'aucun test local ne voit.
      - id: contrat-du-catalogue
        name: dsoxlab validate-structure
        entry: uvx dsoxlab validate-structure
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Le verrou porte la version du `pyproject.toml` : la bouger sans
      # relocker le rend périmé. Ce contrôle existait en CI, donc il attrapait
      # l'erreur APRÈS le push. Mesuré le 2026-10-17 : une version bougée sur
      # les douze catalogues a fait rougir les douze CI, là où un hook l'aurait
      # dit au premier commit. Il est instantané et hors ligne.
      - id: verrou-a-jour
        name: uv.lock décrit bien le pyproject
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: '^(pyproject\.toml|uv\.lock)$'

      # Un verdict ne se commite pas avec ce qu'il mesure. Vecu le 2026-10-22
      # dans deux catalogues, et dans les DEUX SENS : une correction du code
      # partage commitee avec les verdicts qu'elle perimait est passee pour
      # saine, et des labs reattestes sur une branche sont ressortis « a
      # reattester » apres leur fusion en squash, contenu inchange.
      #
      # Le cas qui ne se rattrape JAMAIS : une PR squashee qui retouche un test
      # APRES sa campagne. Le commit unique porte les deux et le squash a
      # detruit ce qui les distinguait. Aucune mesure a posteriori ne peut le
      # voir, ni une date, ni un diff entre deux arbres. Il ne reste qu'a
      # l'empecher.
      - id: verdicts-et-commun-separes
        name: les verdicts ne sont pas commites avec ce qu'ils mesurent
        entry: python3 tests/outils/verdicts_et_commun_separes.py
        language: system
        pass_filenames: false

      # Le garde-fou ci-dessus est lui-meme eprouve, dans les DEUX sens :
      # quatorze cas, ceux qu'il doit refuser et ceux qu'il doit laisser
      # passer. Un garde-fou qui refuserait aussi les commits legitimes se
      # contourne au bout de deux jours, et ne controle alors plus rien.
      - id: garde-fou-des-verdicts-eprouve
        name: le garde-fou des verdicts juge dans les deux sens
        entry: uv run --no-project --with pytest --with pyyaml pytest tests/test_verdicts_et_commun_separes.py -q
        language: system
        pass_filenames: false
        always_run: true
